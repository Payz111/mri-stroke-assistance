[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mri-stroke-assist"
version = "0.1.0"
description = "AI-powered assistant for ischemic stroke detection on brain MRI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rinat" },
]

dependencies = [
    # Core
    "torch>=2.0",
    "monai>=1.3",
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.11",

    # Preprocessing
    "SimpleITK>=2.3",
    "pydicom>=2.4",

    # Config & Tracking
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.8",

    # Data & Evaluation
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pydantic>=2.0",

    # Demo
    "gradio>=4.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "tqdm>=4.65",
]
ants = [
    "antspyx>=0.4",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N812/N813: `torch.nn.functional as F` and `SimpleITK as sitk` are universal idioms.
ignore = ["N812", "N813"]

[tool.ruff.lint.per-file-ignores]
# CLI entry points prepend the project root to sys.path before importing `src`.
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
