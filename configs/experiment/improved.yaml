# Improved experiment v3: minimal augmentation (flip + light noise)
# Usage: python scripts/train.py --config configs/experiment/improved.yaml
#
# Baseline (no aug):      dice=0.606 at epoch 92
# v1 (aggressive aug):    dice=0.405 at epoch 41  -- too much
# v2 (mild aug):          dice=0.438 at epoch 32  -- still too much
# v3 (minimal: flip only): target 0.65+
#
# Lesson: RandAffined (rotation/scale) hurts on small dataset (250 cases).
# Only safe augmentation: flip (doubles data) + very light noise.

model:
  name: "unet3d"
  in_channels: 3
  out_channels: 1
  features: [32, 64, 128, 256]
  dropout: 0.1

training:
  epochs: 150
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 30

augmentation:
  spatial:
    flip_axes: [0]
  intensity:
    noise_std: 0.03
